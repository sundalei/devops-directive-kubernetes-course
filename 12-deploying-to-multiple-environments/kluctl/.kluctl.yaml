targets:
  - name: staging
    args:
      environment: staging
      environmentType: non-prod
    # Adding a context to .kluctl.yaml helps prevent accidentally deploying to the wrong cluster!
    context: civo-cloud-cluster

  - name: production
    args:
      environment: production
      environmentType: prod
    # Adding a context to .kluctl.yaml helps prevent accidentally deploying to the wrong cluster!
    context: gke_gcp-cluster-sundalei_us-central1-a_gcp-cluster-sundalei
args:
  - name: environment
  - name: environmentType

discriminator: kluctl-{{ target.name }}
